<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinEdu - Caso 5 (Celula 4)</title>
    <style>
      :root {
        --bg: #f8f9fa;
        --surface: #ffffff;
        --surface-alt: #eef3f6;
        --primary: #1b4965;
        --primary-strong: #12344a;
        --primary-soft: #2c6e91;
        --border: #d7e0e7;
        --text: #163041;
        --muted: #5f7382;
        --error-bg: #fbe4e6;
        --error-border: #e5a8af;
        --shadow: 0 18px 48px rgba(17, 43, 60, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, 'Times New Roman', serif;
        background:
          radial-gradient(circle at top right, rgba(27, 73, 101, 0.1), transparent 32%),
          linear-gradient(180deg, #fdfefe 0%, var(--bg) 18%, #eef2f4 100%);
        color: var(--text);
      }

      .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        background: linear-gradient(135deg, var(--primary-strong), var(--primary));
        color: #fff;
        box-shadow: 0 10px 24px rgba(10, 28, 40, 0.18);
      }

      .topbar-inner {
        max-width: 800px;
        margin: 0 auto;
        padding: 18px 24px;
      }

      .topbar h1 {
        margin: 0;
        font-size: clamp(1.25rem, 2vw, 1.75rem);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .topbar p {
        margin: 4px 0 0;
        color: rgba(255, 255, 255, 0.84);
        font-size: 0.95rem;
      }

      .page {
        max-width: 800px;
        margin: 0 auto;
        padding: 116px 20px 28px;
      }

      .chat-shell {
        background: rgba(255, 255, 255, 0.84);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(215, 224, 231, 0.9);
        border-radius: 24px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .chat-log {
        height: min(68vh, 720px);
        overflow-y: auto;
        padding: 24px 18px;
        background:
          linear-gradient(180deg, rgba(238, 243, 246, 0.4), transparent 28%),
          repeating-linear-gradient(
            180deg,
            rgba(27, 73, 101, 0.02) 0,
            rgba(27, 73, 101, 0.02) 1px,
            transparent 1px,
            transparent 34px
          );
        scroll-behavior: smooth;
      }

      .message-row {
        display: flex;
        margin-bottom: 16px;
      }

      .message-row.user {
        justify-content: flex-end;
      }

      .message-row.bot,
      .message-row.error {
        justify-content: flex-start;
      }

      .bubble {
        max-width: 78%;
        padding: 14px 16px;
        border-radius: 18px;
        line-height: 1.55;
        font-size: 0.98rem;
        white-space: pre-wrap;
        word-break: break-word;
        animation: rise-in 180ms ease-out;
      }

      .bubble.user {
        background: linear-gradient(135deg, var(--primary-soft), var(--primary));
        color: #fff;
        border-bottom-right-radius: 6px;
      }

      .bubble.bot {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        border-bottom-left-radius: 6px;
      }

      .bubble.error {
        background: var(--error-bg);
        border: 1px solid var(--error-border);
        color: #7a1f29;
        border-bottom-left-radius: 6px;
      }

      .composer {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        padding: 18px;
        border-top: 1px solid rgba(215, 224, 231, 0.95);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), #f3f6f8);
      }

      .composer input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 16px;
        font: inherit;
        color: var(--text);
        background: #fff;
        outline: none;
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      .composer input:focus {
        border-color: var(--primary-soft);
        box-shadow: 0 0 0 4px rgba(44, 110, 145, 0.12);
      }

      .composer button {
        border: 0;
        border-radius: 14px;
        padding: 0 22px;
        min-height: 52px;
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #fff;
        background: linear-gradient(135deg, var(--primary), var(--primary-strong));
        cursor: pointer;
        transition: transform 160ms ease, filter 160ms ease, opacity 160ms ease;
      }

      .composer button:hover:not(:disabled) {
        transform: translateY(-1px);
        filter: brightness(1.06);
      }

      .composer button:disabled,
      .composer input:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }

      @keyframes rise-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 640px) {
        .page {
          padding: 104px 12px 16px;
        }

        .chat-log {
          height: 65vh;
          padding: 18px 12px;
        }

        .bubble {
          max-width: 88%;
        }

        .composer {
          grid-template-columns: 1fr;
        }

        .composer button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <h1>🏦 FinEdu - Asistente Inteligente</h1>
        <p>Consultas RAG - Licitaciones MEF</p>
      </div>
    </header>

    <main class="page">
      <section class="chat-shell" aria-label="Chat FinEdu">
        <div id="chatLog" class="chat-log"></div>

        <div class="composer">
          <input
            id="chatInput"
            type="text"
            placeholder="¿Qué obras hay en San Martín de Porres?"
            autocomplete="off"
          />
          <button id="sendButton" type="button">Enviar</button>
        </div>
      </section>
    </main>

    <script>
      const WEBHOOK_URL = '/api/chat';
      const resolvedWebhookUrl =
        WEBHOOK_URL === 'AQUI_VA_LA_URL_DE_N8N' ? '/api/chat' : WEBHOOK_URL;

      const chatLog = document.getElementById('chatLog');
      const chatInput = document.getElementById('chatInput');
      const sendButton = document.getElementById('sendButton');

      function scrollToBottom() {
        chatLog.scrollTop = chatLog.scrollHeight;
      }

      function addMessage(text, type) {
        const row = document.createElement('div');
        row.className = `message-row ${type}`;

        const bubble = document.createElement('div');
        bubble.className = `bubble ${type}`;
        bubble.textContent = text;

        row.appendChild(bubble);
        chatLog.appendChild(row);
        scrollToBottom();

        return row;
      }

      async function sendMessage() {
        const message = chatInput.value.trim();

        if (!message) {
          chatInput.focus();
          return;
        }

        chatInput.value = '';
        chatInput.disabled = true;
        sendButton.disabled = true;

        addMessage(message, 'user');
        const loadingBubble = addMessage('⏳ Consultando base vectorial...', 'bot');

        try {
          const response = await fetch(resolvedWebhookUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ chatInput: message })
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();
          loadingBubble.remove();
          addMessage(data.output ?? 'No se recibió respuesta del asistente.', 'bot');
        } catch (_error) {
          loadingBubble.remove();
          addMessage('No fue posible completar la consulta. Verifica la conexión con el servidor o n8n.', 'error');
        } finally {
          chatInput.disabled = false;
          sendButton.disabled = false;
          chatInput.focus();
        }
      }

      sendButton.addEventListener('click', sendMessage);
      chatInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          sendMessage();
        }
      });

      addMessage('Bienvenido. Formula una consulta para revisar licitaciones y obras registradas en el MEF.', 'bot');
      scrollToBottom();
      chatInput.focus();
    </script>
  </body>
</html>
