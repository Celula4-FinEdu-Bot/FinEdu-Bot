services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n_local
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Lima
      - TZ=America/Lima
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: finedu_frontend
    ports:
      - "8080:8080"
      - "5000:80"
    restart: unless-stopped

volumes:
  n8n_data: