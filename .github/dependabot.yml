# Dependabot - SCA continuo. Ubicacion: .github/dependabot.yml
# VERIFICAR que cada "directory" exista; Dependabot ignora rutas sin manifiesto.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Lima"
    open-pull-requests-limit: 5
    labels: ["dependencias", "devsecops"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "npm"
    directory: "/src/n8n-workflow" # verificar: debe contener package.json
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Lima"
    open-pull-requests-limit: 5
    labels: ["dependencias", "backend"]
    commit-message:
      prefix: "chore(backend)"
    groups:
      actualizaciones-menores:
        update-types: ["minor", "patch"]

  - package-ecosystem: "nuget"
    directory: "/src/frontend/src" # corregido: aqui esta src.csproj
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Lima"
    open-pull-requests-limit: 5
    labels: ["dependencias", "frontend"]
    commit-message:
      prefix: "chore(frontend)"
    groups:
      actualizaciones-menores:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/src/ia-ops" # requiere requirements.txt
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Lima"
    open-pull-requests-limit: 5
    labels: ["dependencias", "ia-ops"]
    commit-message:
      prefix: "chore(ia-ops)"
    groups:
      actualizaciones-menores:
        update-types: ["minor", "patch"]

  # Solo abre PRs con nuevas imagenes base; no edita nada por si mismo.
  - package-ecosystem: "docker"
    directory: "/infrastructure" # donde esta el Dockerfile
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Lima"
    open-pull-requests-limit: 3
    labels: ["dependencias", "infra"]
    commit-message:
      prefix: "chore(docker)"
