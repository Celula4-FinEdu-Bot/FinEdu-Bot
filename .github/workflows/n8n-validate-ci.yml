name: Validar JSONs de n8n

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths:
      - "src/n8n-workflows/**"
      - ".github/workflows/n8n-validate-ci.yml"

permissions:
  contents: read

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Validar sintaxis JSON
        shell: bash
        run: |
          echo "Validando archivos JSON de n8n..."
          error_found=0
          file_found=0

          while IFS= read -r -d '' file; do
            file_found=1
            if python3 -m json.tool "$file" > /dev/null 2>&1; then
              echo "OK: $file"
            else
              echo "JSON invalido: $file"
              error_found=1
            fi
          done < <(
            find src/n8n-workflows/production src/n8n-workflows/templates \
              -type f -name "*.json" -print0 2>/dev/null
          )

          if [ "$file_found" -eq 0 ]; then
            echo "Aun no hay flujos JSON. Se omite validacion."
            exit 0
          fi
          if [ "$error_found" -eq 1 ]; then
            echo "Se encontraron archivos JSON invalidos."
            exit 1
          fi
          echo "Todos los archivos JSON son validos."

      - name: Buscar credenciales quemadas en los flujos JSON
        shell: bash
        run: |
          echo "Buscando patrones de credenciales expuestas..."
          # Clave/valor con valor literal (las expresiones ={{ ... }} no coinciden)
          PATTERN='(api[_-]?key|apikey|secret|password|passwd|token|bearer|authorization)"?[[:space:]]*[:=][[:space:]]*"[A-Za-z0-9_.-]{8,}"'
          # Tokens con formato conocido y URLs con usuario:clave
          PATTERN2='(gsk_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{30,}|sk-[A-Za-z0-9]{20,}|rnd_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|Bearer [A-Za-z0-9._-]{20,}|://[^/@ "]+:[^/@ "]+@)'

          found=0
          file_found=0
          while IFS= read -r -d '' file; do
            file_found=1
            if grep -Eiq "$PATTERN" "$file" || grep -Eq "$PATTERN2" "$file"; then
              echo "Posible credencial quemada en: $file"
              grep -Ein "$PATTERN" "$file" | sed -E 's/"[A-Za-z0-9_.-]{8,}"/"***"/' || true
              found=1
            fi
          done < <(find src/n8n-workflows/production src/n8n-workflows/templates \
                     -type f -name "*.json" -print0 2>/dev/null)

          if [ "$file_found" -eq 0 ]; then
            echo "Aun no hay flujos JSON. Se omite escaneo de credenciales."
            exit 0
          fi
          if [ "$found" -eq 1 ]; then
            echo "Usa Credentials de n8n en vez de valores literales."
            exit 1
          fi
          echo "No se encontraron credenciales quemadas."
