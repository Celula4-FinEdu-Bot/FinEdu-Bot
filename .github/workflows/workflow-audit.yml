name: Auditoria de Workflows (zizmor)

# Informativo: NO marcar como required check.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor-informativo
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Auditar workflows
        run: |
          pip install zizmor
          zizmor --format plain .github/workflows || true
