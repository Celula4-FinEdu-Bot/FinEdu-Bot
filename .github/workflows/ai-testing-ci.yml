name: AI Ops & Prompt Security Testing

# ============================================================
# CORRECCIONES APLICADAS RESPECTO A LA VERSION ANTERIOR
# ============================================================
# 1. Se eliminaron los filtros de "paths" en pull_request.
#    El comentario original advertia de este problema pero el
#    codigo si tenia los paths. Al marcarse como required check
#    en Branch Protection (tarea T4), un PR que no tocara
#    src/ia-ops se quedaba colgado en "Expected - Waiting for
#    status" y nadie podia mergear.
#    Ahora el workflow siempre corre; si no hay cambios en
#    src/ia-ops, los pasos se omiten pero reportan exito.
#
# 2. Se corrigieron los nombres de los secrets: el workflow
#    inyectaba ANTHROPIC_API_KEY y OPENAI_API_KEY, pero el
#    proyecto usa Groq y Google Gemini. Las variables llegaban
#    vacias y los tests pasaban en falso.
#
# 3. Se agrego verificacion explicita de secrets: si faltan,
#    el pipeline avisa en vez de fallar con un error opaco.
# ============================================================

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ai-testing:
    name: QA de Prompts y Salidas del Modelo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Verificar si existe el modulo de IA Ops
        id: existe
        run: |
          if [ -d "src/ia-ops" ]; then
            echo "resultado=true" >> "$GITHUB_OUTPUT"
            echo "Modulo src/ia-ops encontrado."
          else
            echo "resultado=false" >> "$GITHUB_OUTPUT"
            echo "Aun no existe src/ia-ops. Se omiten las pruebas de IA."
          fi

      - name: Validar estructura de IA Ops
        if: steps.existe.outputs.resultado == 'true'
        run: |
          echo "Verificando carpetas esperadas en src/ia-ops..."
          FALTANTES=()
          for CARPETA in prompts tests config-observability; do
            if [ ! -d "src/ia-ops/$CARPETA" ]; then
              FALTANTES+=("$CARPETA")
            fi
          done

          if [ ${#FALTANTES[@]} -gt 0 ]; then
            echo "Faltan carpetas obligatorias: ${FALTANTES[*]}"
            exit 1
          fi
          echo "Estructura de IA Ops valida."

      - name: Verificar que los secrets esten configurados
        if: steps.existe.outputs.resultado == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
        run: |
          # No imprime los valores, solo si estan presentes.
          FALTAN=0
          if [ -z "$GROQ_API_KEY" ]; then
            echo "ADVERTENCIA: GROQ_API_KEY no esta configurado en GitHub Secrets."
            FALTAN=1
          fi
          if [ -z "$GOOGLE_GEMINI_API_KEY" ]; then
            echo "ADVERTENCIA: GOOGLE_GEMINI_API_KEY no esta configurado en GitHub Secrets."
            FALTAN=1
          fi

          if [ $FALTAN -eq 1 ]; then
            echo "Las pruebas que requieran llamadas reales al LLM se omitiran."
          else
            echo "Secrets de proveedores de IA presentes."
          fi

      - name: Detectar credenciales embebidas en prompts y configuracion
        if: steps.existe.outputs.resultado == 'true'
        run: |
          # Control DevSecOps: ninguna llave debe viajar en el repositorio.
          echo "Buscando posibles credenciales hardcodeadas..."
          PATRONES='(gsk_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{30,}|sk-[A-Za-z0-9]{20,})'

          if grep -rEn "$PATRONES" src/ia-ops/ 2>/dev/null; then
            echo ""
            echo "FALLO: se detectaron credenciales embebidas en src/ia-ops."
            echo "Mover el valor a GitHub Secrets y referenciarlo por variable de entorno."
            exit 1
          fi
          echo "Sin credenciales embebidas."

      - name: Configurar Python
        if: steps.existe.outputs.resultado == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        if: steps.existe.outputs.resultado == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests pydantic
          if [ -f src/ia-ops/requirements.txt ]; then
            pip install -r src/ia-ops/requirements.txt
          fi

      - name: Ejecutar pruebas de IA
        if: steps.existe.outputs.resultado == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
        run: |
          TEST_FILES=$(find src/ia-ops/tests -type f \( -name "test_*.py" -o -name "*_test.py" \) 2>/dev/null)
          if [ -n "$TEST_FILES" ]; then
            pytest src/ia-ops/tests/ -v --tb=short
          else
            echo "Aun no hay archivos de prueba en src/ia-ops/tests. Se omite la ejecucion."
          fi
