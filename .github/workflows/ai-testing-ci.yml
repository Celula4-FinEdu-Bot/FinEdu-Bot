
name: AI Ops & Prompt Security Testing

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  ai-testing:
    name: QA de Prompts y Salidas del Modelo
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Validar estructura de IA Ops
      - name: Validar estructura de IA Ops
        run: |
          echo "Verificando carpetas esperadas en src/ia-ops..."

          test -d "src/ia-ops/prompts"
          test -d "src/ia-ops/tests"
          test -d "src/ia-ops/config-observability"

          echo "Estructura de IA Ops válida."

      # 3. Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 4. Instalar dependencias generales
      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests pydantic

          if [ -f src/ia-ops/requirements.txt ]; then
            pip install -r src/ia-ops/requirements.txt
          fi

      # 5. Detectar pruebas Playwright
      - name: Detectar si hay pruebas de Playwright
        id: playwright
        run: |
          if grep -rl "playwright" src/ia-ops/tests 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Se detectaron pruebas con Playwright."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # 6. Instalar Playwright
      - name: Instalar Playwright
        if: steps.playwright.outputs.found == 'true'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      # 7. Detectar pruebas Selenium
      - name: Detectar si hay pruebas de Selenium
        id: selenium
        run: |
          if grep -rl "import selenium\|from selenium" src/ia-ops/tests 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Se detectaron pruebas funcionales con Selenium."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # 8. Instalar Selenium
      - name: Instalar Selenium
        if: steps.selenium.outputs.found == 'true'
        run: |
          pip install selenium

      # 9. Configurar Chrome para Selenium
      - name: Configurar Chrome headless
        if: steps.selenium.outputs.found == 'true'
        uses: browser-actions/setup-chrome@v1

      # 10. Ejecutar pruebas de QA
      - name: Ejecutar pruebas de QA
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          TEST_FILES=$(find src/ia-ops/tests -type f \( -name "test_*.py" -o -name "*_test.py" \) 2>/dev/null || true)

          if [ -n "$TEST_FILES" ]; then
            pytest src/ia-ops/tests/ -v --tb=short
          else
            echo "Aún no hay archivos de prueba en src/ia-ops/tests. Se omite la ejecución."
          fi

