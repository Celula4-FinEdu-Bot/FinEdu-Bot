name: AI Ops & Prompt Security Testing

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths:
      - "src/ia-ops/**"
      - ".github/workflows/ai-testing-ci.yml"

permissions:
  contents: read

jobs:
  ai-testing:
    name: QA de Prompts, LLM y Pruebas Funcionales (Selenium)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Validar estructura de IA Ops
        run: |
          echo "Verificando carpetas esperadas en src/ia-ops..."
          test -d "src/ia-ops/prompts"
          test -d "src/ia-ops/tests"
          test -d "src/ia-ops/config-observability"
          echo "Estructura de IA Ops valida."

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias base
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests pydantic
          [ -f src/ia-ops/requirements.txt ] && pip install -r src/ia-ops/requirements.txt || true

      - name: Detectar si hay pruebas de Selenium
        id: selenium
        run: |
          if grep -rl "import selenium\|from selenium" src/ia-ops/tests 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Se detectaron pruebas funcionales con Selenium."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar Selenium y navegador (solo si aplica)
        if: steps.selenium.outputs.found == 'true'
        run: pip install selenium

      - name: Configurar Chrome headless (solo si aplica)
        if: steps.selenium.outputs.found == 'true'
        uses: browser-actions/setup-chrome@v1

      - name: Levantar el frontend para pruebas de interfaz (solo si aplica)
        if: steps.selenium.outputs.found == 'true'
        working-directory: src/frontend
        run: |
          npm install
          npm run build --if-present
          npm run start --if-present &
          sleep 10

      - name: Ejecutar pruebas de QA (prompts, LLM y funcionales)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          TEST_FILES=$(find src/ia-ops/tests -type f \( -name "test_*.py" -o -name "*_test.py" \) 2>/dev/null || true)
          if [ -n "$TEST_FILES" ]; then
            pytest src/ia-ops/tests/ -v --tb=short
          else
            echo "Aun no hay archivos de prueba en src/ia-ops/tests. Se omite la ejecucion."
          fi

      - name: Publicar evidencia de resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-qa-ia-ops
          path: src/ia-ops/tests/reports/
          retention-days: 7
          if-no-files-found: ignore
