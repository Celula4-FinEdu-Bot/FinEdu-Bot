
name: Gitleaks Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
      - Arquitectura-Lezma-HU-45
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install Gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Add Go binaries to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan current files
        run: gitleaks dir . --redact --verbose

      - name: Validate controlled detection
        shell: bash
        run: |
          set -euo pipefail

          test_dir="$RUNNER_TEMP/ca03-test"
          mkdir -p "$test_dir"

          cat > "$RUNNER_TEMP/gitleaks-test.toml" <<'EOF'
          title = "CA-03 Controlled Test"

          [[rules]]
          id = "ca03-test-canary"
          description = "Detects the fictitious CA-03 canary"
          regex = '''CA03_CANARY_[A-Z0-9]{16}'''
          secretGroup = 0
          keywords = ["CA03_CANARY_"]
          EOF

          printf '%s\n' 'CA03_CANARY_ABCDEF1234567890' > "$test_dir/canary.txt"
          report="$RUNNER_TEMP/ca03-report.json"
          trap 'rm -rf "$test_dir" "$report"' EXIT

          set +e
          gitleaks dir "$test_dir" \
            --config "$RUNNER_TEMP/gitleaks-test.toml" \
            --redact \
            --report-format json \
            --report-path "$report" \
            --exit-code 1
          result=$?
          set -e

          if [ "$result" -ne 1 ]; then
            echo "CA-03 ERROR: expected detection exit code 1, got $result."
            exit 1
          fi

          python3 - "$report" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              findings = json.load(f)

          if not any(
              finding.get("RuleID") == "ca03-test-canary"
              for finding in findings
          ):
              print("CA-03 ERROR: expected rule was not found in the report.")
              sys.exit(1)

          print("CA-03 OK: Gitleaks detected the canary file with the expected rule.")
          PY
