name: Backup & Restore - FinEdu-Bot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/backup-restore/**"
      - "tests/backup-restore/**"
      - ".github/workflows/backup-restore.yml"

permissions:
  contents: read

jobs:
  backup-restore:
    name: Backup & Restore (PostgreSQL + n8n)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finedu
          POSTGRES_PASSWORD: finedu_demo
          POSTGRES_DB: finedu_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finedu -d finedu_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SOURCE_DATABASE_URL: postgresql://finedu:finedu_demo@localhost:5432/finedu_source
      TARGET_DATABASE_URL: postgresql://finedu:finedu_demo@localhost:5432/finedu_restore
      N8N_VOLUME: finedu_n8n_demo
      N8N_CONTAINER: n8n_local
      BACKUP_ROOT: /tmp/finedu-backups

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Ejecutar pruebas estáticas
        run: |
          chmod +x scripts/backup-restore/*.sh
          chmod +x tests/backup-restore/*.sh
          ./tests/backup-restore/backup-restore.test.sh

      - name: Preparar entorno de integración
        run: |
          set -euo pipefail

          docker volume create "$N8N_VOLUME"

          docker run --rm \
            -v "$N8N_VOLUME:/data" \
            alpine:3.20 \
            sh -c 'echo "n8n-demo-state" > /data/restore-demo.txt'

          PGPASSWORD=finedu_demo psql \
            "host=localhost port=5432 dbname=finedu_source user=finedu" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE backup_demo (id integer PRIMARY KEY, dato text NOT NULL);" \
            -c "INSERT INTO backup_demo VALUES (1, 'FinEdu-Bot backup OK');"

          PGPASSWORD=finedu_demo createdb \
            -h localhost \
            -p 5432 \
            -U finedu \
            finedu_restore

      - name: Generar respaldo
        env:
          DATABASE_URL: ${{ env.SOURCE_DATABASE_URL }}
        run: |
          set -euo pipefail

          ./scripts/backup-restore/backup.sh

          BACKUP_DIR="$(find "$BACKUP_ROOT" \
            -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          test -n "$BACKUP_DIR"

          echo "BACKUP_DIR=$BACKUP_DIR" >> "$GITHUB_ENV"

      - name: Verificar integridad SHA-256
        run: |
          set -euo pipefail

          test -s "$BACKUP_DIR/postgres.dump"
          test -s "$BACKUP_DIR/n8n-data.tar.gz"
          test -s "$BACKUP_DIR/manifest.txt"

          cd "$BACKUP_DIR"
          sha256sum --check SHA256SUMS

      - name: Restaurar respaldo
        env:
          DATABASE_URL: ${{ env.TARGET_DATABASE_URL }}
          RESTORE_CONFIRM: RESTAURAR
        run: |
          set -euo pipefail

          ./scripts/backup-restore/restore.sh "$BACKUP_DIR"

      - name: Verificar PostgreSQL y n8n
        run: |
          set -euo pipefail

          RESULT="$(PGPASSWORD=finedu_demo psql \
            "host=localhost port=5432 dbname=finedu_restore user=finedu" \
            -Atc "SELECT dato FROM backup_demo WHERE id = 1")"

          test "$RESULT" = "FinEdu-Bot backup OK"

          docker run --rm \
            -v "$N8N_VOLUME:/data:ro" \
            alpine:3.20 \
            sh -ec 'test "$(cat /data/restore-demo.txt)" = "n8n-demo-state"'

          echo "PostgreSQL restaurado correctamente."
          echo "Volumen n8n restaurado correctamente."

      - name: Resumen final
        if: always()
        run: |
          {
            echo "## Backup & Restore - FinEdu-Bot"
            echo ""

            if [[ "${{ job.status }}" == "success" ]]; then
              echo "### ✅ TODAS LAS PRUEBAS APROBADAS"
              echo "- Scripts validados"
              echo "- Backup PostgreSQL"
              echo "- Backup volumen n8n"
              echo "- Integridad SHA-256"
              echo "- Restauración PostgreSQL"
              echo "- Restauración n8n"
            else
              echo "### ❌ ERROR EN UNA O MÁS PRUEBAS"
              echo "Revisar los pasos marcados en rojo."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finedu-backup-restore-evidence
          path: /tmp/finedu-backups/
          if-no-files-found: warn
          retention-days: 7
