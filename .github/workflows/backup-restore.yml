name: Backup & Restore - FinEdu-Bot

on:
  workflow_dispatch:

  pull_request:

permissions:
  contents: read

jobs:
  backup-restore:
    name: Backup & Restore
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finedu
          POSTGRES_PASSWORD: finedu_demo
          POSTGRES_DB: finedu_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finedu -d finedu_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SOURCE_DATABASE_URL: postgresql://finedu:finedu_demo@localhost:5432/finedu_source
      TARGET_DATABASE_URL: postgresql://finedu:finedu_demo@localhost:5432/finedu_restore
      N8N_VOLUME: finedu_n8n_demo
      N8N_CONTAINER: n8n_local
      BACKUP_ROOT: /tmp/finedu-backups

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Dar permisos a los scripts
        run: |
          chmod +x scripts/backup-restore/backup.sh
          chmod +x scripts/backup-restore/restore.sh

      - name: Preparar entorno de prueba
        run: |
          set -e

          docker volume create "$N8N_VOLUME"

          docker run --rm \
            -v "$N8N_VOLUME:/data" \
            alpine:3.20 \
            sh -c 'echo "n8n-demo-state" > /data/restore-demo.txt'

          PGPASSWORD=finedu_demo psql \
            "host=localhost port=5432 dbname=finedu_source user=finedu" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE backup_demo (id integer PRIMARY KEY, dato text NOT NULL);" \
            -c "INSERT INTO backup_demo VALUES (1, 'FinEdu-Bot backup OK');"

          PGPASSWORD=finedu_demo createdb \
            -h localhost \
            -p 5432 \
            -U finedu \
            finedu_restore

      - name: Generar respaldo
        env:
          DATABASE_URL: ${{ env.SOURCE_DATABASE_URL }}
        run: |
          set -e

          ./scripts/backup-restore/backup.sh

          BACKUP_DIR="$(find "$BACKUP_ROOT" \
            -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          test -n "$BACKUP_DIR"

          echo "BACKUP_DIR=$BACKUP_DIR" >> "$GITHUB_ENV"

      - name: Comprobar archivos del respaldo
        run: |
          set -e

          test -s "$BACKUP_DIR/postgres.dump"
          test -s "$BACKUP_DIR/n8n-data.tar.gz"
          test -s "$BACKUP_DIR/manifest.txt"
          test -s "$BACKUP_DIR/SHA256SUMS"

          cd "$BACKUP_DIR"
          sha256sum --check SHA256SUMS

      - name: Restaurar respaldo
        env:
          DATABASE_URL: ${{ env.TARGET_DATABASE_URL }}
          RESTORE_CONFIRM: RESTAURAR
        run: |
          set -e

          ./scripts/backup-restore/restore.sh "$BACKUP_DIR"

      - name: Verificar PostgreSQL y n8n
        run: |
          set -e

          RESULT="$(PGPASSWORD=finedu_demo psql \
            "host=localhost port=5432 dbname=finedu_restore user=finedu" \
            -Atc "SELECT dato FROM backup_demo WHERE id = 1")"

          if [ "$RESULT" != "FinEdu-Bot backup OK" ]; then
            echo "Error: PostgreSQL no recuperó los datos."
            exit 1
          fi

          docker run --rm \
            -v "$N8N_VOLUME:/data:ro" \
            alpine:3.20 \
            sh -c 'test "$(cat /data/restore-demo.txt)" = "n8n-demo-state"'

          echo "PostgreSQL restaurado correctamente."
          echo "Volumen n8n restaurado correctamente."

      - name: Resumen
        if: always()
        run: |
          echo "## Backup & Restore - FinEdu-Bot" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Proceso de respaldo y restauración ejecutado." >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar respaldos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finedu-backup-restore
          path: /tmp/finedu-backups/
          if-no-files-found: warn
          retention-days: 7
