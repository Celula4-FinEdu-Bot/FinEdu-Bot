name: FinEdu-Bot - Backup & Restore

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - Kevin
  pull_request:

permissions:
  contents: read

jobs:
  backup-restore:
    name: Backup & Restore Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finedu
          POSTGRES_PASSWORD: finedu_demo
          POSTGRES_DB: finedu_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finedu -d finedu_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: 1. Preparar entorno
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

          docker volume create finedu_n8n_test

      - name: 2. Crear datos de demostración
        run: |
          set -e

          PGPASSWORD=finedu_demo psql \
            "host=localhost port=5432 dbname=finedu_source user=finedu" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE backup_demo (
              id SERIAL PRIMARY KEY,
              mensaje TEXT NOT NULL
            );" \
            -c "INSERT INTO backup_demo (mensaje)
              VALUES ('FinEdu-Bot backup restaurado correctamente');"

          docker run --rm \
            -v finedu_n8n_test:/data \
            alpine:3.20 \
            sh -c 'echo "n8n-data-restaurada" > /data/demo.txt'

          PGPASSWORD=finedu_demo createdb \
            -h localhost -p 5432 -U finedu finedu_restore

      - name: 3. Generar backup PostgreSQL
        run: |
          set -e

          mkdir -p /tmp/finedu-backup

          pg_dump \
            "postgresql://finedu:finedu_demo@localhost:5432/finedu_source" \
            --format=custom \
            --no-owner \
            --no-acl \
            --file=/tmp/finedu-backup/postgres.dump

      - name: 4. Generar backup n8n
        run: |
          set -e

          docker run --rm \
            -v finedu_n8n_test:/source:ro \
            -v /tmp/finedu-backup:/backup \
            alpine:3.20 \
            tar czf /backup/n8n-data.tar.gz -C /source .

      - name: 5. Verificar integridad
        run: |
          set -e

          cd /tmp/finedu-backup

          test -s postgres.dump
          test -s n8n-data.tar.gz

          sha256sum postgres.dump n8n-data.tar.gz > SHA256SUMS

          sha256sum --check SHA256SUMS

      - name: 6. Restaurar PostgreSQL
        run: |
          set -e

          pg_restore \
            --dbname="postgresql://finedu:finedu_demo@localhost:5432/finedu_restore" \
            --no-owner \
            --no-acl \
            --exit-on-error \
            /tmp/finedu-backup/postgres.dump

      - name: 7. Restaurar volumen n8n
        run: |
          set -e

          docker run --rm \
            -v finedu_n8n_test:/data \
            -v /tmp/finedu-backup:/backup:ro \
            alpine:3.20 \
            sh -ec '
              find /data -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              tar xzf /backup/n8n-data.tar.gz -C /data
            '

      - name: 8. Comprobar restauración PostgreSQL
        run: |
          set -e

          RESULT=$(PGPASSWORD=finedu_demo psql \
            "host=localhost port=5432 dbname=finedu_restore user=finedu" \
            -Atc "SELECT mensaje FROM backup_demo WHERE id=1")

          test "$RESULT" = "FinEdu-Bot backup restaurado correctamente"

          echo "PostgreSQL: restauración correcta."

      - name: 9. Comprobar restauración n8n
        run: |
          set -e

          docker run --rm \
            -v finedu_n8n_test:/data:ro \
            alpine:3.20 \
            sh -c 'test "$(cat /data/demo.txt)" = "n8n-data-restaurada"'

          echo "n8n: restauración correcta."

      - name: 10. Resultado final
        run: |
          echo "## Backup & Restore - FinEdu-Bot" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Todas las verificaciones finalizaron correctamente." >> "$GITHUB_STEP_SUMMARY"
          echo "- Backup PostgreSQL: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backup n8n: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Integridad SHA-256: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Restore PostgreSQL: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Restore n8n: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: 11. Guardar respaldos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finedu-backup-evidence
          path: /tmp/finedu-backup/
          if-no-files-found: warn
          retention-days: 7
