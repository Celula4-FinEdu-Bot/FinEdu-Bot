name: SAST - Analisis Estatico de Seguridad

on:
  # Sin filtro de "paths": CodeQL analiza el repositorio completo,
  # y como puede ser required check, debe correr siempre para no
  # quedar colgado en "Expected - Waiting for status".
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: CodeQL - ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      # Matriz fija (no dinamica): las categorias de CodeQL deben ser
      # siempre las mismas entre main y cada PR, o GitHub no puede
      # comparar los resultados ("configuration not found on main").
      matrix:
        language: ["javascript-typescript", "python"]

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Verificar si hay codigo real para este lenguaje
        id: check
        run: |
          if [ "${{ matrix.language }}" = "javascript-typescript" ]; then
            MATCH=$(find . -path "*/node_modules" -prune -o -type f \( -iname "*.ts" -o -iname "*.tsx" -o -iname "*.js" -o -iname "*.jsx" \) -print | head -1)
          elif [ "${{ matrix.language }}" = "python" ]; then
            MATCH=$(find . -path "*/node_modules" -prune -o -type f -iname "*.py" -print | head -1)
          fi

          if [ -n "$MATCH" ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            echo "Codigo encontrado para ${{ matrix.language }}: $MATCH"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "Aun no hay codigo ${{ matrix.language }} en el repositorio. Se omite el analisis."
          fi

      - name: Inicializar CodeQL
        if: steps.check.outputs.has_code == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Analisis automatico
        if: steps.check.outputs.has_code == 'true'
        uses: github/codeql-action/autobuild@v3

      - name: Ejecutar analisis CodeQL
        if: steps.check.outputs.has_code == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
