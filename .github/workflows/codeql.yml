name: SAST - Analisis Estatico de Seguridad

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: CodeQL - ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ["csharp"]

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Verificar si hay codigo real para este lenguaje
        id: check
        run: |
          MATCH=$(find . -path "*/node_modules" -prune -o -path "*/bin" -prune -o -path "*/obj" -prune -o -type f -iname "*.cs" -print | head -1)
          if [ -n "$MATCH" ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            echo "Codigo encontrado: $MATCH"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "Aun no hay codigo C# en el repositorio. Se omite el analisis."
          fi

      - name: Inicializar CodeQL
        if: steps.check.outputs.has_code == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Analisis automatico
        if: steps.check.outputs.has_code == 'true'
        uses: github/codeql-action/autobuild@v3

      - name: Ejecutar analisis CodeQL
        if: steps.check.outputs.has_code == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
