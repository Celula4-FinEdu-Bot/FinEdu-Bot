name: Backup PostgreSQL + n8n

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC = 00:00 hora Lima
  workflow_dispatch: # permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: read

jobs:
  backup:
    # Debe correr en el servidor donde están los contenedores (runner propio con Docker)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Crear .env desde variables y secrets del repo
        working-directory: devsecops/scripts/backup-restore
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$BACKUP_PASSPHRASE" ] || { echo "Falta el secret BACKUP_PASSPHRASE"; exit 1; }
          cat > .env <<EOT
          PROJECT_NAME=${{ vars.PROJECT_NAME }}
          POSTGRES_CONTAINER=${{ vars.POSTGRES_CONTAINER }}
          N8N_CONTAINER=${{ vars.N8N_CONTAINER }}
          POSTGRES_USER=${{ vars.POSTGRES_USER }}
          POSTGRES_DB=${{ vars.POSTGRES_DB }}
          N8N_HEALTH_URL=${{ vars.N8N_HEALTH_URL }}
          BACKUP_DIR=./backups
          RETENTION_DAYS=7
          BACKUP_PASSPHRASE=$BACKUP_PASSPHRASE
          EOT

      - name: Ejecutar backup
        working-directory: devsecops/scripts/backup-restore
        run: ./backup.sh

      - name: Guardar backup (cifrado) como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: |
            devsecops/scripts/backup-restore/backups/*.enc
            devsecops/scripts/backup-restore/backups/*.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Limpiar .env del runner
        if: always()
        run: rm -f devsecops/scripts/backup-restore/.env
