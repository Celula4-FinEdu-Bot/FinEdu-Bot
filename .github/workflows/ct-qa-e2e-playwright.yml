name: QA E2E (Playwright)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-tests:
    name: e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dev_db
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: CHANGE_ME
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev -d dev_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=dev_db;Username=dev;Password=CHANGE_ME"
      Backend__BaseUrl: http://localhost:3000

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Verificar carpeta E2E
        run: test -d src/ia-ops/tests/e2e

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publicar app Blazor
        working-directory: src/frontend/src
        run: |
          dotnet restore
          dotnet publish -c Release -o "$GITHUB_WORKSPACE/publish"
          ls -la "$GITHUB_WORKSPACE/publish"

      - name: Levantar app Blazor
        run: |
          nohup dotnet "$GITHUB_WORKSPACE/publish/src.dll" \
            --urls=http://localhost:5204 > app.log 2>&1 &
          echo $! > app.pid

          for i in $(seq 1 30); do
            if ! kill -0 "$(cat app.pid)" 2>/dev/null; then
              echo "::error::La aplicación se cerró al iniciar."
              cat app.log
              exit 1
            fi

            code=$(curl -s -o /dev/null -w "%{http_code}" \
              http://localhost:5204/ || true)

            if [ "$code" != "000" ]; then
              echo "App respondió con HTTP $code"
              exit 0
            fi

            sleep 2
          done

          echo "::error::La app no respondió a tiempo."
          cat app.log
          exit 1

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/ia-ops/tests/e2e/package-lock.json

      - name: Instalar dependencias E2E
        working-directory: src/ia-ops/tests/e2e
        run: npm ci

      - name: Instalar Chromium
        working-directory: src/ia-ops/tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        working-directory: src/ia-ops/tests/e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5204
          CI: "true"
        run: npx playwright test

      - name: Mostrar log de Blazor
        if: failure()
        run: cat app.log

      - name: Subir log de Blazor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: app.log
          if-no-files-found: warn
          retention-days: 7

      - name: Subir reporte Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/ia-ops/tests/e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14
