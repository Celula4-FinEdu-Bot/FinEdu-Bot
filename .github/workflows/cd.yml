name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validar configuración
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.RENDER_SERVICE_ID_FRONTEND }}
        run: |
          [ -n "$RENDER_API_KEY" ] || { echo "Falta el secret RENDER_API_KEY"; exit 1; }
          [ -n "$SERVICE_ID" ]     || { echo "Falta la variable RENDER_SERVICE_ID_FRONTEND"; exit 1; }
          echo "Configuración OK"

      - name: Disparar deploy en Render
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.RENDER_SERVICE_ID_FRONTEND }}
        run: |
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Error al disparar el deploy: $BODY"
            exit 1
          fi

          DEPLOY_ID=$(echo "$BODY" | jq -r '.id // empty')
          [ -n "$DEPLOY_ID" ] || { echo "No se obtuvo deploy id: $BODY"; exit 1; }

          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "Deploy disparado con id: $DEPLOY_ID"

      - name: Esperar a que el deploy esté live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.RENDER_SERVICE_ID_FRONTEND }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          [ -n "$DEPLOY_ID" ] || { echo "DEPLOY_ID vacío"; exit 1; }

          MAX_INTENTOS=40
          INTENTO=0
          while [ $INTENTO -lt $MAX_INTENTOS ]; do
            BODY=$(curl -sS \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID")
            STATUS=$(echo "$BODY" | jq -r '.status // empty')
            [ -n "$STATUS" ] || { echo "Respuesta inesperada: $BODY"; exit 1; }

            echo "Intento $((INTENTO+1))/$MAX_INTENTOS - estado: $STATUS"

            case "$STATUS" in
              live)
                echo "OK: el deploy está live."
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated)
                echo "El deploy terminó con estado: $STATUS. Revisar logs en Render."
                exit 1
                ;;
            esac

            INTENTO=$((INTENTO+1))
            sleep 15
          done

          echo "Se agotó el tiempo de espera (10 min)."
          exit 1

      - name: Health check (opcional)
        env:
          HEALTH_URL: ${{ vars.FRONTEND_HEALTH_URL }}
        run: |
          [ -n "$HEALTH_URL" ] || { echo "Sin FRONTEND_HEALTH_URL, se omite."; exit 0; }
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$HEALTH_URL")
          echo "Health check: HTTP $CODE"
          [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ]
