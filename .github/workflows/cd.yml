name: CD - Despliegue a Render

# Se dispara solo cuando algo llega a main (ya paso los required checks).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos minimos
permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy en Render
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID_FRONTEND }}
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Error de la API: $BODY"
            exit 1
          fi

          DEPLOY_ID=$(echo "$BODY" | jq -r '.id // empty')
          if [ -z "$DEPLOY_ID" ]; then
            echo "No se pudo obtener el deploy_id: $BODY"
            exit 1
          fi

          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "Deploy disparado con id: $DEPLOY_ID"

      - name: Esperar el estado real del deploy (polling)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.RENDER_SERVICE_ID_FRONTEND }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          MAX_INTENTOS=40      # 40 x 15s = 10 minutos maximo
          INTENTO=0

          while [ $INTENTO -lt $MAX_INTENTOS ]; do
            STATUS=$(curl -s \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID" \
              | jq -r '.status')

            echo "Intento $((INTENTO+1))/$MAX_INTENTOS - estado actual: $STATUS"

            case "$STATUS" in
              live)
                echo "OK: el deploy termino y esta live."
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated)
                echo "El deploy termino con estado: $STATUS. Revisar logs en Render."
                exit 1
                ;;
            esac

            INTENTO=$((INTENTO+1))
            sleep 15
          done

          echo "Se agoto el tiempo de espera (10 min) sin confirmar que el deploy este live."
          exit 1

      - name: Validar salud del servicio
        env:
          URL: ${{ vars.FRONTEND_HEALTH_URL }}
        run: |
          echo "Validando frontend: $URL"

          STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 30 "$URL")
          echo "HTTP status final: $STATUS"

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            echo "::error::El frontend no esta saludable. HTTP $STATUS"
            exit 1
          fi

          echo "OK: frontend saludable en produccion."
