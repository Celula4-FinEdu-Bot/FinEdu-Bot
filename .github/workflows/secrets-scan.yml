name: Secrets Scan (Gitleaks)

# Required check en main. Sin filtro "paths" a proposito para que
# nunca quede en "Expected - Waiting for status".
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    # Escaneo semanal del historial completo (evidencia T23)
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Escanear secretos
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # En PR: solo los commits del PR (los hallazgos viejos no bloquean a todos).
          # En push/schedule/manual: historial completo.
          ARGS=()
          if [ "$EVENT" = "pull_request" ]; then
            ARGS+=("--log-opts=${BASE_SHA}..${HEAD_SHA}")
          fi

          gitleaks detect --source . --config .gitleaks.toml \
            --redact --verbose --exit-code 1 \
            --report-format sarif --report-path gitleaks-report.sarif \
            "${ARGS[@]}"

      - name: Subir reporte (evidencia)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          if-no-files-found: ignore
          retention-days: 30
